[workspace]
members = ["runtime", "winit", "widget", "build_helpers"]
resolver = "3"

[workspace.package]
version = "0.14.0"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/iced-rs/iced"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]
rust-version = "1.92"

[workspace.dependencies]
iced = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_beacon = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_core = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_debug = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_devtools = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_futures = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_graphics = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_highlighter = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_program = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_renderer = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_runtime = { version = "0.14.0", path = "runtime" }
iced_selector = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_test = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_tester = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }
iced_tiny_skia = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4", default-features = false }
iced_wgpu = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4", default-features = false }
iced_widget = { version = "0.14.2", path = "widget" }
iced_winit = { version = "0.14.0", path = "winit", default-features = false }
bincode = "1.3"
cargo-hot = { version = "0.1", package = "cargo-hot-protocol" }
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }
glam = "0.25"
iced_accessibility = { version = "0.1", git = "https://github.com/pop-os/libcosmic", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4" }

async-std = "1.0"


bitflags = "2.5"
bytemuck = { version = "1.0", features = ["derive"] }
bytes = "1.6"
cosmic-text = "0.19"
cryoglyph = { git = "https://github.com/iced-rs/cryoglyph.git", rev = "e429a025df36ab8145708acb309080ae3deec17a" }
dark-light = "1.0"
resvg = "0.45"
web-sys = "0.3.69"
guillotiere = "0.6"
half = "2.2"
image = { version = "0.25", default-features = false }
kamadak-exif = "0.6"
kurbo = "0.10"
lilt = "0.8"
log = "0.4"
lyon = "1.0"
lyon_path = "1.0"
mundy = { version = "0.2", default-features = false }
nom = "8"
num-traits = "0.2"
ouroboros = "0.18"
png = "0.18"
pulldown-cmark = "0.12"
qrcode = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
rfd = "0.16"
rustc-hash = "2.0"
semver = "1.0"
serde = "1.0"
sha2 = "0.10"
sipper = "0.1"
smol = "2"
smol_str = "0.3"
sysinfo = "0.33"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = [
    "std",
    "simd",
] }
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d" }
softbuffer = { git = "https://github.com/pop-os/softbuffer", tag = "cosmic-4.0" }
syntect = "5.2"
tokio = "1.0"
tracing = "0.1"
two-face = { version = "0.4", default-features = false, features = [
    "syntect-default-fancy",
] }
unicode-segmentation = "1.0"
url = "2.5"
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4.2"
web-time = "1.1"
wgpu = { version = "28.0", default-features = false, features = [
    "std",
    "wgsl",
] }
wayland-protocols = { version = "0.32.1", features = ["staging"] }
wayland-client = { version = "0.31.5" }
# web-time = "1.1"


# wgpu = "0.19"
# Newer wgpu commit that fixes Vulkan backend on Nvidia
winapi = "0.3"
# window_clipboard = "0.4.1"

window_clipboard = { git = "https://github.com/pop-os/window_clipboard.git", tag = "sctk-0.20" }
dnd = { git = "https://github.com/pop-os/window_clipboard.git", tag = "sctk-0.20" }
mime = { git = "https://github.com/pop-os/window_clipboard.git", tag = "sctk-0.20" }
winit = { git = "https://github.com/pop-os/winit.git", rev = "9567503" }
winit-core = { git = "https://github.com/pop-os/winit.git", rev = "9567503" }
cursor-icon = "1.1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_results = "deny"

[workspace.lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
default_trait_access = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
new_without_default = "deny"
useless_conversion = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"

