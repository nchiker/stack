plugins {
    id 'com.android.application'
}

def checksBuild = providers.gradleProperty('stackChecks').isPresent()
def checksNamespace = providers.gradleProperty('stackChecksNamespace').orElse('').get()
def unsignedRelease = providers.gradleProperty('stackUnsignedRelease').isPresent()
if (providers.gradleProperty('stackRecovery').isPresent()) {
    throw new GradleException('Stack Recovery is retired; build the single org.stackdocs.app development application')
}
if (unsignedRelease && checksBuild) {
    throw new GradleException('Choose stackChecks or stackUnsignedRelease')
}
if (!checksNamespace.isEmpty() && (!checksBuild || !checksNamespace.matches('[a-z][a-z0-9_]{0,31}'))) {
    throw new GradleException('A checks namespace requires -PstackChecks and a simple lowercase test suffix')
}

android {
    namespace 'org.stackdocs.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId checksBuild ? 'org.stackdocs.app.checks' + (checksNamespace.isEmpty() ? '' : '.' + checksNamespace) : 'org.stackdocs.app'
        manifestPlaceholders = [appLabel: checksBuild ? ('TEST Stack' + (checksNamespace.isEmpty() ? '' : ' ' + checksNamespace)) : '@string/app_name']
        // Checks builds only: one extra pinned caller as package:sha256 (for example a debug-signed owner app under test). Empty in every other build.
        // True in checks builds only: lets ExtractService run the scripted hang, crash and out-of-memory of the checks.
        resValue 'bool', 'stack_checks', checksBuild ? 'true' : 'false'
        resValue 'string', 'stack_extra_pin', checksBuild ? providers.gradleProperty('stackExtraPin').orElse('').get() : ''
        minSdk 24
        targetSdk 36
        versionCode 38
        versionName '0.21.0'
        testInstrumentationRunner providers.gradleProperty('preservationProbe').isPresent() ? 'org.stackdocs.app.PreservationRunner' : 'org.stackdocs.app.ScannerChecks'
    }

    buildFeatures {
        resValues true
    }

    sourceSets {
        main { jniLibs.srcDir new File(buildDir, 'stacknative/jniLibs') }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ext.stackSigningProfile = 'development'
ext.stackUnsignedRelease = unsignedRelease
apply from: rootProject.file('gradle/stack-signing.gradle')

dependencies {
    // Bundled QR decoding; pairing never needs a Google service or download.
    implementation 'com.google.zxing:core:3.5.4'
    // Standard single-threaded, bundled native engine; no runtime downloads.
    implementation('cz.adaptech.tesseract4android:tesseract4android:4.9.0') {
        exclude group: 'androidx.annotation'
    }
    // Maintained image metadata parsing, including orientation on older Android versions.
    implementation('androidx.exifinterface:exifinterface:1.4.2') {
        exclude group: 'androidx.annotation'
    }
    // EXIF annotations are compile-time metadata; their Kotlin tooling stays out of the APK.
    compileOnly 'androidx.annotation:annotation-jvm:1.8.1'
}

tasks.register('verifyOcrDependency') {
    group = 'verification'
    description = 'Verify the independently acquired bundled OCR binary and English model.'
    doLast {
        def artifact = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'cz.adaptech.tesseract4android'
        }
        if (artifact == null) throw new GradleException('Missing bundled OCR dependency')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
        if (actual != 'bce5d6413a1a5ae3d7240033fbbc851ba3217d0a08d9769400e17a077f42cb2a') {
            throw new GradleException('OCR artifact SHA-256 mismatch')
        }
        def expectedModel = '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
        def model = file('src/main/assets/ocr/eng.traineddata')
        def manifest = new groovy.json.JsonSlurper().parse(file('src/main/assets/ocr/manifest.json'))
        def modelHash = java.security.MessageDigest.getInstance('SHA-256').digest(model.bytes).encodeHex().toString()
        if (modelHash != expectedModel || manifest.model_sha256 != expectedModel || model.length() != manifest.model_bytes) {
            throw new GradleException('Bundled English OCR model/manifest mismatch')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyOcrDependency' }

tasks.register('verifyQrDependency') {
    group = 'verification'
    description = 'Verify the pinned, bundled QR decoder.'
    doLast {
        def artifact = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'com.google.zxing' && it.name == 'core'
        }
        if (artifact == null) throw new GradleException('Missing bundled QR decoder')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
        if (actual != '71de5d89341b5fcf5dd89da7f44e84d825d0e084cdf3ec77c9abe26b0f0ceb13') {
            throw new GradleException('QR decoder artifact SHA-256 mismatch')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyQrDependency' }

// Calendar time must come from Clock.now() so checks can fix it (see Clock.java).
tasks.register('checkClockUse') {
    def sources = fileTree('src/main/java') { include '**/*.java'; exclude '**/Clock.java' }
    inputs.files(sources)
    doLast {
        def offenders = sources.files.findAll { it.text.contains('System.currentTimeMillis()') || it.text.contains('new Date()') }
        if (!offenders.isEmpty()) throw new GradleException('Use Clock.now() for calendar time (checks can fix it): ' + offenders*.name.join(', '))
    }
}
preBuild.dependsOn 'checkClockUse'

// Phone native library (Rust, arm64-v8a): Ami Pro text for org.stackdocs.app.types.NativeText. Built here so a normal build has it.
// Tools are found the standard way, never from a fixed path: the NDK from ndk.dir in local.properties, else ANDROID_NDK_HOME /
// ANDROID_NDK_ROOT / ANDROID_NDK, else the newest <sdk.dir>/ndk/<version>; cargo from PATH (rust-toolchain.toml in the crate pins the compiler and target).
def stackNdk = {
    def found = []
    def props = new Properties()
    def local = rootProject.file('local.properties')
    if (local.isFile()) local.withInputStream { props.load(it) }
    if (props.getProperty('ndk.dir')) found << file(props.getProperty('ndk.dir'))
    ['ANDROID_NDK_HOME', 'ANDROID_NDK_ROOT', 'ANDROID_NDK'].each { if (System.getenv(it)) found << file(System.getenv(it)) }
    def sdk = props.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (sdk && new File(sdk, 'ndk').isDirectory()) {
        (new File(sdk, 'ndk').listFiles() ?: []).findAll { it.isDirectory() }.sort { it.name }.reverse().each { found << it }
    }
    return found.find { new File(it, 'toolchains/llvm/prebuilt').isDirectory() }
}
tasks.register('buildStackNative', Exec) {
    group = 'build'
    description = 'Build libstacknative.so (Rust) for arm64-v8a with the Android NDK.'
    def crate = file('src/main/rust/stacknative')
    def outDir = layout.buildDirectory.dir('stacknative/jniLibs/arm64-v8a')
    // Sources only: the crate's target/ folder (build output, possibly gigabytes) is not an input.
    inputs.files(fileTree(dir: 'src/main/rust', excludes: ['**/target/**'])).withPropertyName('rustSources')
    inputs.property('ndkDir', providers.provider { String.valueOf(stackNdk()) })
    outputs.dir(outDir)
    workingDir crate
    // The phone and the computer must read Ami Pro files with the same code: one AmiPro-Linux commit in both Cargo.toml files.
    inputs.file(rootProject.file('desktop/Cargo.toml')).withPropertyName('desktopCargo')
    doFirst {
        // Every `amipro-… =` dependency line in each file must carry a full rev (so a reformatted line cannot slip past).
        def amiRevs = [file('src/main/rust/stacknative/Cargo.toml'), rootProject.file('desktop/Cargo.toml')].collectMany { toml ->
            def lines = toml.readLines().findAll { it ==~ /amipro-[a-z]+\s*=.*/ }
            def revs = lines.collectMany { line -> (line =~ /AmiPro-Linux", rev = "([0-9a-f]{40})" \}/).collect { m -> m[1] } }
            if (lines.isEmpty() || revs.size() != lines.size()) throw new GradleException("${toml}: every amipro- dependency must be { git = \".../AmiPro-Linux\", rev = \"<40 hex digits>\" }")
            revs
        }.unique()
        if (amiRevs.size() != 1) throw new GradleException("The AmiPro-Linux rev differs between stacknative/Cargo.toml and desktop/Cargo.toml: ${amiRevs}")
        def ndk = stackNdk()
        if (ndk == null) throw new GradleException('Android NDK not found. Install it (sdkmanager "ndk;<version>") and set ndk.dir=<path> in local.properties, or set ANDROID_NDK_HOME. It builds Stack\'s native library (libstacknative.so).')
        def prebuilt = new File(ndk, 'toolchains/llvm/prebuilt').listFiles().find { it.isDirectory() }
        def linker = new File(prebuilt, 'bin/aarch64-linux-android24-clang')
        if (!linker.isFile()) throw new GradleException('The Android NDK at ' + ndk + ' has no aarch64-linux-android24-clang; use a current NDK (r26 or newer).')
        // The crate's rust-toolchain.toml names the compiler. If it is not installed the build stops here with a clear
        // message: a build must never download a toolchain on its own (rustup would otherwise fetch it silently).
        environment 'RUSTUP_AUTO_INSTALL', '0'
        def pin = new File(crate, 'rust-toolchain.toml').text
        def matcher = (pin =~ /channel\s*=\s*"([^"]+)"/)
        def channel = matcher.find() ? matcher.group(1) : null
        if (channel != null) {
            def ask = { List<String> cmd ->
                try {
                    def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
                    def out = proc.inputStream.text
                    return proc.waitFor() == 0 ? out : null
                } catch (IOException e) { return null }   // no rustup (plain cargo): nothing to download
            }
            def list = ask(['rustup', 'toolchain', 'list'])
            if (list != null) {
                if (!list.readLines().any { it.startsWith(channel + '-') || it.startsWith(channel + ' ') }) {
                    throw new GradleException('Rust toolchain ' + channel + ' (named in ' + crate + '/rust-toolchain.toml) is not installed, and the build does not download it. Install it once: rustup toolchain install ' + channel + ' --target aarch64-linux-android')
                }
                def targets = ask(['rustup', 'target', 'list', '--installed', '--toolchain', channel])
                if (targets == null || !targets.contains('aarch64-linux-android')) {
                    throw new GradleException('Rust toolchain ' + channel + ' has no aarch64-linux-android target, and the build does not download it. Install it once: rustup target add aarch64-linux-android --toolchain ' + channel)
                }
            }
        }
        environment 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER', linker.path
        environment 'CC_aarch64_linux_android', linker.path
        environment 'AR_aarch64_linux_android', new File(prebuilt, 'bin/llvm-ar').path
        commandLine 'cargo', 'build', '--release', '--offline', '--locked', '--target', 'aarch64-linux-android'
        outDir.get().asFile.mkdirs()
    }
    doLast {
        copy {
            from new File(crate, 'target/aarch64-linux-android/release/libstacknative.so')
            into outDir
        }
    }
}
preBuild.dependsOn 'buildStackNative'
