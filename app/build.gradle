plugins {
    id 'com.android.application'
}

def checksBuild = providers.gradleProperty('stackChecks').isPresent()
def checksNamespace = providers.gradleProperty('stackChecksNamespace').orElse('').get()
def unsignedRelease = providers.gradleProperty('stackUnsignedRelease').isPresent()
if (providers.gradleProperty('stackRecovery').isPresent()) {
    throw new GradleException('Stack Recovery is retired; build the single org.stackdocs.app development application')
}
if (unsignedRelease && checksBuild) {
    throw new GradleException('Choose stackChecks or stackUnsignedRelease')
}
if (!checksNamespace.isEmpty() && (!checksBuild || !checksNamespace.matches('[a-z][a-z0-9_]{0,31}'))) {
    throw new GradleException('A checks namespace requires -PstackChecks and a simple lowercase test suffix')
}

android {
    namespace 'org.stackdocs.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId checksBuild ? 'org.stackdocs.app.checks' + (checksNamespace.isEmpty() ? '' : '.' + checksNamespace) : 'org.stackdocs.app'
        manifestPlaceholders = [appLabel: checksBuild ? 'Stack Checks' : '@string/app_name']
        minSdk 24
        targetSdk 36
        versionCode 23
        versionName '0.9.0'
        testInstrumentationRunner providers.gradleProperty('preservationProbe').isPresent() ? 'org.stackdocs.app.PreservationRunner' : 'org.stackdocs.app.ScannerChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ext.stackSigningProfile = 'development'
ext.stackUnsignedRelease = unsignedRelease
apply from: rootProject.file('gradle/stack-signing.gradle')

dependencies {
    // Bundled QR decoding; pairing never needs a Google service or download.
    implementation 'com.google.zxing:core:3.5.4'
    // Standard single-threaded, bundled native engine; no runtime downloads.
    implementation('cz.adaptech.tesseract4android:tesseract4android:4.9.0') {
        exclude group: 'androidx.annotation'
    }
    // Maintained image metadata parsing, including orientation on older Android versions.
    implementation('androidx.exifinterface:exifinterface:1.4.2') {
        exclude group: 'androidx.annotation'
    }
    // EXIF annotations are compile-time metadata; their Kotlin tooling stays out of the APK.
    compileOnly 'androidx.annotation:annotation-jvm:1.8.1'
}

tasks.register('verifyOcrDependency') {
    group = 'verification'
    description = 'Verify the independently acquired bundled OCR binary and English model.'
    doLast {
        def artifact = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'cz.adaptech.tesseract4android'
        }
        if (artifact == null) throw new GradleException('Missing bundled OCR dependency')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
        if (actual != 'bce5d6413a1a5ae3d7240033fbbc851ba3217d0a08d9769400e17a077f42cb2a') {
            throw new GradleException('OCR artifact SHA-256 mismatch')
        }
        def expectedModel = '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
        def model = file('src/main/assets/ocr/eng.traineddata')
        def manifest = new groovy.json.JsonSlurper().parse(file('src/main/assets/ocr/manifest.json'))
        def modelHash = java.security.MessageDigest.getInstance('SHA-256').digest(model.bytes).encodeHex().toString()
        if (modelHash != expectedModel || manifest.model_sha256 != expectedModel || model.length() != manifest.model_bytes) {
            throw new GradleException('Bundled English OCR model/manifest mismatch')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyOcrDependency' }

tasks.register('verifyQrDependency') {
    group = 'verification'
    description = 'Verify the pinned, bundled QR decoder.'
    doLast {
        def artifact = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'com.google.zxing' && it.name == 'core'
        }
        if (artifact == null) throw new GradleException('Missing bundled QR decoder')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
        if (actual != '71de5d89341b5fcf5dd89da7f44e84d825d0e084cdf3ec77c9abe26b0f0ceb13') {
            throw new GradleException('QR decoder artifact SHA-256 mismatch')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyQrDependency' }
