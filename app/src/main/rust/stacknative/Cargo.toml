[package]
name = "stacknative"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"  # Stack's own code; the Ami Pro crates it depends on stay MPL-2.0
rust-version = "1.85"
publish = false
description = "Stack phone native library: Ami Pro text (JNI, org.stackdocs.app.types.NativeText)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Ami Pro for Linux's reader, straight from its public repo. Keep this rev equal to desktop/Cargo.toml's.
amipro-text = { git = "https://github.com/nchiker/AmiPro-Linux", rev = "24605e1714fa92d3700931273c104126041c5394" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": every JNI entry point catches panics and answers "damaged".

[workspace]
